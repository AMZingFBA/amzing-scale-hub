[build]
  command = "npm ci && npm run build && node scripts/seo-guard.mjs dist"
  publish = "dist"

[[redirects]]
  from = "/whatsapp-export"
  to = "/whatsapp-export.html"
  status = 200
  force = true

[[redirects]]
  from = "/kentino_whatsapp.html"
  to = "/kentino_whatsapp.html"
  status = 200
  force = true

[[redirects]]
  from = "/media2/*"
  to = "/media2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "prerender"
  path = "/*"
  excludedPath = ["/kentino_whatsapp.html", "/whatsapp-export", "/whatsapp-export.html", "/media2/*"]
