[build]
  command = "npm ci && npm run build && node scripts/seo-guard.mjs dist"
  publish = "dist"

[[redirects]]
  from = "/crm"
  to = "/crm.html"
  status = 200
  force = true

[[redirects]]
  from = "/whatsapp-export"
  to = "/whatsapp-export.html"
  status = 200
  force = true

[[redirects]]
  from = "/kentino_whatsapp.html"
  to = "/kentino_whatsapp.html"
  status = 200
  force = true

[[redirects]]
  from = "/media2/*"
  to = "/media2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/blog-sitemap.xml"
  to = "https://wvmfzlogijvqcsgablrb.supabase.co/functions/v1/blog-sitemap"
  status = 200
  force = true

# === SEO 301 — Décannibalisation pillar "amazon-fba-cest-quoi-guide-complet" ===
[[redirects]]
  from = "/blog/fba-amazon-cest-quoi-explication-complete"
  to = "/blog/amazon-fba-cest-quoi-guide-complet"
  status = 301
  force = true

[[redirects]]
  from = "/blog/cest-quoi-amazon-fba-definition-complete"
  to = "/blog/amazon-fba-cest-quoi-guide-complet"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "prerender"
  path = "/*"
  excludedPath = ["/kentino_whatsapp.html", "/whatsapp-export", "/whatsapp-export.html", "/crm", "/crm.html", "/media2/*"]
